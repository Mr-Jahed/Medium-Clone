services:
  # Backend Service
  - type: web
    name: mediumclone-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mediumclone-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://mediumclone-frontend.onrender.com

  # Frontend Service
  - type: web
    name: mediumclone-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./build
    envVars:
      - key: REACT_APP_API_URL
        value: https://mediumclone-backend.onrender.com

  # Database
  - type: pgsql
    name: mediumclone-db
    region: oregon
    plan: free
    databaseName: mediumclone
    databaseUser: mediumclone
